name: crisis-validation

# Fetches ~10y of daily prices (stocks + ETF overlay instruments) and runs the
# crisis backtests (2016-2019 regime, COVID 2020, 2022 bear, 2025 crash) with
# cost sensitivity, short overlay, and the breaker hedge. Commits:
#   .cache/history_close.parquet / history_volume.parquet  (arb page + reruns)
#   crisis_report.json                                     (the results)
#
# Runs on demand and monthly — the long fetch is heavy, don't put it on the
# daily refresh cadence.

on:
  schedule:
    - cron: "0 12 1 * *"     # 1st of the month, 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crisis-validation
  cancel-in-progress: false

jobs:
  crisis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch long history (2015+, stocks + ETFs)
        env:
          DCF_CACHE_DIR: ".cache"
          SENTRY_HIST_START: "2015-01-01"
        run: python history_layer.py

      - name: Run crisis validation
        env:
          DCF_CACHE_DIR: ".cache"
        run: python crisis_core.py

      - name: Commit history + report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: crisis validation run"
          file_pattern: ".cache/history_close.parquet .cache/history_volume.parquet crisis_report.json"
