name: refresh-data

# Fetches market data, commits the cache, then saves Sentry's scores to
# brief/sentry_brief.json for the Morning Letter (read at 6:45 AM ET).

on:
  schedule:
    # 5:30 AM New York time on weekdays, leaving time for a slow refresh
    # and GitHub start delays before the 6:45 AM letter.
    - cron: "30 5 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch: {}   # manual "Run workflow" button

permissions:
  contents: write          # needed to commit the refreshed cache and brief

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch snapshot
        env:
          USE_EDGAR: "1"
          EDGAR_USER_AGENT: "Sentry akhamlin008@gmail.com"
          INCLUDE_HOLDERS_INSIDER: "0"
          DCF_CACHE_DIR: ".cache"
        run: python fetch_snapshot.py

      - name: Export brief for the Morning Letter
        if: always()   # still writes a file (marked failed) if the fetch had trouble
        env:
          USE_EDGAR: "1"
          EDGAR_USER_AGENT: "Sentry akhamlin008@gmail.com"
          INCLUDE_HOLDERS_INSIDER: "0"
          DCF_CACHE_DIR: ".cache"
        run: python export_brief.py

      - name: Commit refreshed cache and brief
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: data refresh"
          file_pattern: ".cache/** brief/**"
