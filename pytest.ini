[pytest]
; test_factor_risk.py and Test_core.py are check-runner SCRIPTS, not pytest
; modules -- CI runs them with `python` directly. Keep pytest collection to
; the real pytest suites so their module-level code never runs at collection.
testpaths = tests test_enhanced.py
addopts = -q
markers =
    oracle: validates our math against gs-quant/scipy/statsmodels oracles; needs requirements-dev.txt
